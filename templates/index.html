<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keep Wrapped</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1a1a1a;
            padding: 50px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 450px;
        }
        h1 {
            background: linear-gradient(90deg, #ff8a00, #e52e71);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p { color: #888; line-height: 1.6; margin-bottom: 30px; }
        .upload-btn {
            background: white;
            color: black;
            padding: 15px 32px;
            border-radius: 50px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
            display: inline-block;
        }
        .upload-btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(255,255,255,0.2); }
        input[type="file"] { display: none; }
        .error { color: #ff4b4b; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Keep Wrapped</h1>
        <p>Your year in notes. Upload your Google Keep JSON <b>Takeout.zip</b> file to generate your summary.</p>
        <form method="POST" enctype="multipart/form-data">
            <label class="upload-btn">
                Select ZIP File
                <input type="file" name="file" accept=".zip" onchange="this.form.submit()">
            </label>
        </form>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
